<style>
	#lovable-badge {
		--badge-bg: #1b1b1b;
		--badge-text: #c5c1b9;
		--badge-text-hover: #dcdad5;
		--badge-radius: 6px;
		--badge-padding: 8px;
		--badge-gap: 6px;
		--badge-shadow: 
			0 0 0 1px rgba(0, 0, 0, 0.88),
			0 1px 0 0 rgba(0, 0, 0, 0.04),
			0 2px 2px -1px rgba(0, 0, 0, 0.08),
			0 4px 4px -2px rgba(0, 0, 0, 0.08),
			0 8px 8px -4px rgba(0, 0, 0, 0.08),
			0 16px 16px -8px rgba(0, 0, 0, 0.08);
		--badge-transition-duration: 0.2s;
		--badge-transition-easing: cubic-bezier(0.16, 1, 0.32, 1);
		--focus-color: #575ECF;
		--focus-offset: 2px;
		--focus-width: 2px;
		
		position: fixed;
		bottom: 12px;
		right: 12px;
		height: 24px;
		display: flex;
		align-items: center;
		z-index: 1000000;
		background-color: var(--badge-bg) !important;
		color: var(--badge-text) !important;
		border-radius: var(--badge-radius);
		box-shadow: var(--badge-shadow) !important;
		font-size: 12px;
		font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		font-weight: 400 !important;
		text-transform: none !important;
		font-feature-settings: normal !important;
		transform: translateZ(0);
		will-change: transform, opacity;
		transition: opacity var(--badge-transition-duration) var(--badge-transition-easing);
	}

	#lovable-badge.closing {
		opacity: 0;
		pointer-events: none;
	}

	#lovable-badge-cta {
		display: flex;
		align-items: baseline;
		gap: var(--badge-gap);
		box-sizing: border-box;
		padding: 4px var(--badge-padding) 0;
		height: 100%;
		color: inherit;
		text-decoration: none;
		white-space: nowrap;
		border-radius: var(--badge-radius) 0 0 var(--badge-radius);
		transition: 
			background-color var(--badge-transition-duration) ease,
			color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-cta:hover {
		background: rgba(255, 255, 255, 0.04);
		color: var(--badge-text-hover);
	}

	#lovable-badge-cta:active {
		transform: scale(0.98);
	}

	#lovable-badge-cta:focus {
		outline: none;
	}

	#lovable-badge-cta:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: var(--focus-offset);
		z-index: 1;
	}

	#lovable-badge-text {
		line-height: 1;
	}

	/* The wordmark baseline sits at y=12 of the 16px logo; an empty 12px box
	   makes that the flex baseline so the text aligns to it on any system font. */
	#lovable-badge-logo {
		position: relative;
		display: block;
		width: 52px;
		height: 12px;
	}

	#lovable-badge-logo svg {
		position: absolute;
		top: 0;
		left: 0;
	}

	#lovable-badge-divider {
		width: 1px;
		height: 24px;
		background-color: rgba(255, 255, 255, 0.04);
		flex-shrink: 0;
	}

	#lovable-badge-close {
		width: 24px;
		height: 24px;
		min-width: 24px;
		min-height: 24px;
		cursor: pointer;
		background: none;
		border: none;
		padding: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 0 var(--badge-radius) var(--badge-radius) 0;
		flex-shrink: 0;
		transition: 
			background-color var(--badge-transition-duration) ease,
			transform 0.1s ease;
	}

	#lovable-badge-close:hover {
		background: rgba(255, 255, 255, 0.04);
	}

	#lovable-badge-close:active {
		transform: scale(0.92);
	}

	#lovable-badge-close:focus {
		outline: none;
	}

	#lovable-badge-close:focus-visible {
		outline: var(--focus-width) solid var(--focus-color);
		outline-offset: calc(var(--focus-offset) * -1);
		z-index: 1;
	}

	#lovable-badge-close svg path {
		fill: var(--badge-text);
		transition: fill var(--badge-transition-duration) ease;
	}

	#lovable-badge-close:hover svg path {
		fill: var(--badge-text-hover);
	}

	@media (prefers-reduced-motion: reduce) {
		#lovable-badge,
		#lovable-badge-cta,
		#lovable-badge-close,
		#lovable-badge-close svg path {
			transition: none;
		}
		
		#lovable-badge-cta:active,
		#lovable-badge-close:active {
			transform: none;
		}
	}

	@media (prefers-contrast: high) {
		#lovable-badge {
			--badge-bg: #000;
			--badge-text: #fff;
			--badge-text-hover: #fff;
			border: 2px solid currentColor;
		}
		
		#lovable-badge-cta:focus-visible,
		#lovable-badge-close:focus-visible {
			outline-width: 3px;
		}
	}
</style>

    &lt;!-- Header App --&gt;

              &lt;div class=&quot;flex items-center gap-2&quot;&gt;

    // SINKRONISASI DATA DARI SPREADSHEET (MULTI-PERANGKAT)
    async function syncAllReports(showNotice = true) {
      const btn = document.getElementById(&#x27;btnSync&#x27;);
      if (btn) btn.innerHTML = &#x27;&lt;i class=&quot;fa-solid fa-arrows-rotate fa-spin&quot;&gt;&lt;/i&gt;&#x27;;
      
      try {
        const res = await fetch(GAS_URL + &#x27;?action=getReports&#x27;);
        if (res.ok) {
          const json = await res.json();
          if (json &amp;&amp; json.reports &amp;&amp; Array.isArray(json.reports)) {
            // Merge reports dengan local reports
            const existingKeys = new Set(savedReports.map(reportKey));
            let addedCount = 0;
            json.reports.forEach(remote =&gt; {
              const k = reportKey(remote);
              if (!existingKeys.has(k)) {
                savedReports.push(remote); existingKeys.add(k);
                addedCount++;
              }
            });
            localStorage.setItem(&#x27;app_saved_reports_v5&#x27;, JSON.stringify(savedReports));
            if (showNotice &amp;&amp; addedCount &gt; 0) {
              showNotice(&#x27;Berhasil mensinkronkan &#x27; + addedCount + &#x27; laporan baru dari perangkat lain!&#x27;);
            }
          }
        }
      } catch (err) {
        console.log(&#x27;Sync offline fallback:&#x27;, err);
      } finally {
        if (btn) btn.innerHTML = &#x27;&lt;i class=&quot;fa-solid fa-arrows-rotate&quot;&gt;&lt;/i&gt;&#x27;;
        if (currentTeacher) {
          renderSantriList(currentSantriList);
          renderLeaderboard();
        }
      }
    }

            ${sudahQuran ? &#x27;&lt;span class=&quot;absolute -top-1 -right-1 bg-amber-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center shadow&quot;&gt;&lt;i class=&quot;fa-solid fa-star&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27; : &#x27;&#x27;}

                `&lt;span class=&quot;inline-block text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-200 truncate max-w-full&quot;&gt;🟢 ${todayReport.summary || &#x27;Sudah Disetor&#x27;}&lt;/span&gt;`

          &lt;/div&gt;
          &lt;button onclick=&quot;openReportModalFor(&#x27;${studentKey(s)}&#x27;)&quot; class=&quot;px-3 py-2 ${!todayReport ? &#x27;bg-rose-600 hover:bg-rose-700&#x27; : &#x27;bg-emerald-600 hover:bg-emerald-700&#x27;} text-white rounded-xl text-xs font-bold shadow-sm transition flex-shrink-0&quot;&gt;
            Nilai
          &lt;/button&gt;
        `;
        container.appendChild(card);
      });
    }

    // MULTI-LAYER IMAGE FALLBACK
    function handleImageFallback(img, name) {
      if (!img.dataset.proxyTried) {
        img.dataset.proxyTried = &quot;1&quot;;
        let clean = img.src.replace(&#x27;ibb.co.com&#x27;, &#x27;ibb.co&#x27;);
        img.src = &quot;https://wsrv.nl/?url=&quot; + encodeURIComponent(clean);
      } else {
        img.onerror = null;
        img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&amp;background=10b981&amp;color=fff&amp;size=128`;
      }
    }

    function filterSantriList(q) {
      renderSantriList(currentSantriList.filter(s =&gt; s.nama.toLowerCase().includes(q.toLowerCase()) || studentKey(s).includes(q)));
    }

    function filterSantriByRombel(r) {
      renderSantriList(r === &#x27;ALL&#x27; ? currentSantriList : currentSantriList.filter(s =&gt; s.kelas === r));
    }

    // MODAL INPUT LAPORAN
    function openReportModalFor(nisn) {
      selectedStudent = currentSantriList.find(s =&gt; studentKey(s) === nisn);
      if (!selectedStudent) return;

      document.getElementById(&#x27;modalSantriNama&#x27;).innerText = selectedStudent.nama;
      document.getElementById(&#x27;modalSantriKelas&#x27;).innerText = `${selectedStudent.kelas} - NIS: ${selectedStudent.nis}`;
      
      const fotoEl = document.getElementById(&#x27;modalSantriFoto&#x27;);
      fotoEl.src = selectedStudent.foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(selectedStudent.nama)}&amp;background=10b981&amp;color=fff&amp;size=128`;
      fotoEl.onerror = () =&gt; handleImageFallback(fotoEl, selectedStudent.nama);

      // Cek setoran terakhir kemarin
      const last = getLastReport(nisn);
      const kemarinBox = document.getElementById(&#x27;textSetoranKemarin&#x27;);
      if (last) {
        kemarinBox.innerText = `${last[&quot;Tanggal&quot;] || &#x27;Sebelumnya&#x27;}: ${last.summary || &#x27;Tercatat&#x27;}`;
      } else {
        kemarinBox.innerText = &#x27;Belum ada catatan setoran sebelumnya.&#x27;;
      }

      const isTahsin = selectedStudent.kelas.toLowerCase().includes(&#x27;tahsin&#x27;);
      const isLevel3OrIntensif = selectedStudent.kelas.toLowerCase().includes(&#x27;level iii&#x27;) || selectedStudent.kelas.toLowerCase().includes(&#x27;intensif&#x27;);

      document.getElementById(&#x27;tahsinLulusContainer&#x27;).classList.toggle(&#x27;hidden&#x27;, !isTahsin);
      document.getElementById(&#x27;sectionTahsinFields&#x27;).classList.toggle(&#x27;hidden&#x27;, !isTahsin);
      document.getElementById(&#x27;sectionTahfizhFields&#x27;).classList.toggle(&#x27;hidden&#x27;, isTahsin);
      document.getElementById(&#x27;level3IntensifFields&#x27;).classList.toggle(&#x27;hidden&#x27;, !isLevel3OrIntensif);

      if (isTahsin) {
        const sudah = hasGraduatedQuran(nisn);
        document.getElementById(&#x27;checkSudahQuran&#x27;).checked = sudah;
        toggleSudahQuranMode(sudah);
      }

      resetStudentFields();
      document.getElementById(&#x27;reportModal&#x27;).classList.remove(&#x27;hidden&#x27;);
    }

    function closeReportModal() {
      document.getElementById(&#x27;reportModal&#x27;).classList.add(&#x27;hidden&#x27;);
    }

    function toggleSudahQuranMode(isSudah) {
      document.getElementById(&#x27;tahsinIqroInputs&#x27;).classList.toggle(&#x27;hidden&#x27;, isSudah);
      document.getElementById(&#x27;tahsinQuranInputs&#x27;).classList.toggle(&#x27;hidden&#x27;, !isSudah);
      if (isSudah) document.getElementById(&#x27;inputTahsinPredikat&#x27;).value = &#x27;Lancar (Mumtaz)&#x27;;
    }

    function setAllPrayers(val) {
      [&#x27;Subuh&#x27;,&#x27;Dzuhur&#x27;,&#x27;Ashar&#x27;,&#x27;Maghrib&#x27;,&#x27;Isya&#x27;].forEach(p =&gt; {
        document.getElementById(&#x27;sholat&#x27; + p).checked = val;
      });
    }

    function calculateSabaProgress() {
      const a = parseInt(document.getElementById(&#x27;inputSabaAyatAwal&#x27;).value) || 0;
      const b = parseInt(document.getElementById(&#x27;inputSabaAyatAkhir&#x27;).value) || 0;
      const surahA = document.getElementById(&#x27;inputSabaSurahAwal&#x27;).value.trim();
      const surahB = document.getElementById(&#x27;inputSabaSurahAkhir&#x27;).value.trim();
      const badge = document.getElementById(&#x27;badgeSabaStatus&#x27;);
      const summary = document.getElementById(&#x27;sabaSummaryText&#x27;);

      if (b &gt;= a &amp;&amp; b &gt; 0) {
        const diff = (b - a) + 1;
        badge.innerText = `Bertambah (+${diff} Ayat)`;
        badge.className = &#x27;text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-bold&#x27;;
        summary.innerText = `Progres: Bertambah ${diff} ayat (${surahB})`;
      } else {
        badge.innerText = &#x27;Tetap / Mengulang&#x27;;
        badge.className = &#x27;text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold&#x27;;
        summary.innerText = &#x27;Setoran belum bertambah ayat.&#x27;;
      }
    }

    // SIMPAN LAPORAN
    async function saveStudentReport() {
      if (!selectedStudent) return;
      const reportStudent = selectedStudent;

      const btn = document.getElementById(&#x27;btnSaveReport&#x27;);
      const originalText = btn ? btn.innerHTML : &#x27;&#x27;;
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = &#x27;&lt;i class=&quot;fa-solid fa-spinner fa-spin mr-1&quot;&gt;&lt;/i&gt; Menyimpan...&#x27;;
      }

      const tanggal = document.getElementById(&#x27;inputTanggal&#x27;).value;
      const isTahsin = reportStudent.kelas.toLowerCase().includes(&#x27;tahsin&#x27;);
      const sudahQuran = isTahsin ? document.getElementById(&#x27;checkSudahQuran&#x27;).checked : true;

      if (isTahsin &amp;&amp; sudahQuran) {
        localStorage.setItem(`graduated_quran_${studentKey(reportStudent)}`, &#x27;true&#x27;);
      }

      const data = {
        &quot;Timestamp&quot;: new Date().toISOString(),
        &quot;Tanggal&quot;: tanggal,
        &quot;Nama Siswa&quot;: reportStudent.nama,
        &quot;NISN&quot;: reportStudent.nisn,
        &quot;Kelas&quot;: reportStudent.kelas,
        &quot;Wali Kelas&quot;: currentTeacher ? currentTeacher.wali : &#x27;&#x27;,
        &quot;Sholat Subuh&quot;: document.getElementById(&#x27;sholatSubuh&#x27;).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Dzuhur&quot;: document.getElementById(&#x27;sholatDzuhur&#x27;).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Ashar&quot;: document.getElementById(&#x27;sholatAshar&#x27;).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Maghrib&quot;: document.getElementById(&#x27;sholatMaghrib&#x27;).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Isya&quot;: document.getElementById(&#x27;sholatIsya&#x27;).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Tahajjud&quot;: (document.getElementById(&#x27;sholatTahajjud&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Witir&quot;: (document.getElementById(&#x27;sholatWitir&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Sholat Dhuha&quot;: (document.getElementById(&#x27;sholatDhuha&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Puasa Senin Kamis&quot;: (document.getElementById(&#x27;puasaSeninKamis&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Bantu Orang Tua&quot;: (document.getElementById(&#x27;bantuOrangTua&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Murajaah Harian&quot;: (document.getElementById(&#x27;murajaahHarian&#x27;)||{}).checked ? &quot;Ya&quot; : &quot;Tidak&quot;,
        &quot;Menyapu&quot;: document.getElementById(&#x27;ibadahMenyapu&#x27;).checked ? &#x27;Ya&#x27; : &#x27;Tidak&#x27;,
        &quot;Mengepel&quot;: document.getElementById(&#x27;ibadahMengepel&#x27;).checked ? &#x27;Ya&#x27; : &#x27;Tidak&#x27;,
        &quot;Cuci Piring&quot;: document.getElementById(&#x27;ibadahCuciPiring&#x27;).checked ? &#x27;Ya&#x27; : &#x27;Tidak&#x27;,
        &quot;Tidak Main HP&quot;: document.getElementById(&#x27;ibadahTanpaHP&#x27;).checked ? &#x27;Ya&#x27; : &#x27;Tidak&#x27;,
        &quot;Kegiatan Lain&quot;: document.getElementById(&#x27;ibadahLain&#x27;).value.trim(),
        &quot;Catatan Adab&quot;: document.getElementById(&#x27;inputCatatanAdab&#x27;).value.trim()
      };

      let summary = &quot;&quot;;
      if (isTahsin) {
        if (sudahQuran) {
          data[&quot;Tahsin Quran&quot;] = document.getElementById(&#x27;inputTahsinQuranSurahAkhir&#x27;).value;
          summary = `Lulus Quran: ${data[&quot;Tahsin Quran&quot;] || &#x27;Koreksi Bacaan&#x27;}`;
        } else {
          data[&quot;Jilid Iqro&quot;] = document.getElementById(&#x27;inputIqroJilid&#x27;).value;
          data[&quot;Hal Iqro&quot;] = document.getElementById(&#x27;inputIqroHal&#x27;).value;
          summary = `${data[&quot;Jilid Iqro&quot;]} (${data[&quot;Hal Iqro&quot;] || &#x27;Lancar&#x27;})`;
        }
        data[&quot;Predikat&quot;] = document.getElementById(&#x27;inputTahsinPredikat&#x27;).value;
        data[&quot;Evaluasi Tahsin&quot;] = document.getElementById(&#x27;iqroEvaluation&#x27;).textContent;
        summary += &#x27; · &#x27; + data[&quot;Predikat&quot;];
      } else {
        data[&quot;Saba Surah&quot;] = document.getElementById(&#x27;inputSabaSurahAkhir&#x27;).value;
        data[&quot;Saba Status&quot;] = document.getElementById(&#x27;badgeSabaStatus&#x27;).innerText;
        data[&quot;Saba Ayat Awal&quot;] = document.getElementById(&#x27;inputSabaAyatAwal&#x27;).value;
        data[&quot;Saba Ayat Akhir&quot;] = document.getElementById(&#x27;inputSabaAyatAkhir&#x27;).value;
        data[&quot;Saba Surah Awal&quot;] = document.getElementById(&#x27;inputSabaSurahAwal&#x27;).value;
        data[&quot;Sabqi Ayat&quot;] = document.getElementById(&#x27;inputSabqiAyat&#x27;).value;
        data[&quot;Tahsin Awal&quot;] = document.getElementById(&#x27;inputTahsinAwal&#x27;).value;
        data[&quot;Tahsin Akhir&quot;] = document.getElementById(&#x27;inputTahsinAkhir&#x27;).value;
        data[&quot;Sabqi&quot;] = document.getElementById(&#x27;inputSabqiSurah&#x27;).value;
        data[&quot;Manzil&quot;] = document.getElementById(&#x27;inputManzilJuz&#x27;).value;
        data[&quot;Predikat&quot;] = document.getElementById(&#x27;inputSabaPredikat&#x27;).value;
        summary = `Saba: ${data[&quot;Saba Surah&quot;] || &#x27;Lancar&#x27;} (${data[&quot;Saba Status&quot;]})`;
      }

      data[&quot;summary&quot;] = summary;
      savedReports = savedReports.filter(r =&gt; !(reportMatches(r, reportStudent) &amp;&amp; r[&quot;Tanggal&quot;] === tanggal));
      savedReports.unshift(data);
      localStorage.setItem(&#x27;app_saved_reports_v5&#x27;, JSON.stringify(savedReports));

      let sent = false;
      // Kirim ke Google Apps Script tanpa CORS preflight issue
      try {
        await fetch(GAS_URL, {
          method: &#x27;POST&#x27;,
          mode: &#x27;no-cors&#x27;,
          headers: { &#x27;Content-Type&#x27;: &#x27;text/plain;charset=utf-8&#x27; },
          body: JSON.stringify({ action: &quot;saveReport&quot;, data: data, report: data })
        });
        sent = true;
      } catch (err) {
        console.warn(&#x27;Laporan tersimpan lokal, akan disinkron saat online:&#x27;, err);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }

      closeReportModal();
      renderSantriList(currentSantriList);
      renderLeaderboard();
      showNotice(sent ? `Laporan ${reportStudent.nama} tersimpan di perangkat dan telah dikirim. Konfirmasi Google Sheets belum tersedia.` : `Laporan ${reportStudent.nama} tersimpan di perangkat. Pengiriman gagal; kirim ulang saat koneksi tersedia.`, sent ? &quot;success&quot; : &quot;warning&quot;);
    }

    function hasGraduatedQuran(nisn) {
      return localStorage.getItem(`graduated_quran_${nisn}`) === &#x27;true&#x27;;
    }

    function getLastReport(nisn) {
      return savedReports.find(r =&gt; reportMatches(r, findStudent(nisn)));
    }

    // MODAL JURNAL HARIAN

          `;

      document.getElementById(&#x27;journalModal&#x27;).classList.remove(&#x27;hidden&#x27;);
    }

    function closeStudentJournalModal() {
      document.getElementById(&#x27;journalModal&#x27;).classList.add(&#x27;hidden&#x27;);
    }

    // PERINGKAT CAPAIAN SELURUH SANTRI &amp; PODIUM
    function isStudentFullIbadah(rep) {
      if (!rep) return false;
      const chk = [
        rep[&quot;Sholat Subuh&quot;], rep[&quot;Sholat Dzuhur&quot;], rep[&quot;Sholat Ashar&quot;], rep[&quot;Sholat Maghrib&quot;], rep[&quot;Sholat Isya&quot;],
        rep[&quot;Sholat Tahajjud&quot;], rep[&quot;Sholat Witir&quot;], rep[&quot;Sholat Dhuha&quot;], rep[&quot;Puasa Senin Kamis&quot;],
        rep[&quot;Bantu Orang Tua&quot;], rep[&quot;Murajaah Harian&quot;]
      ];
      return chk.every(v =&gt; v === &quot;Ya&quot; || v === true);
    }

    function setAllPrayers(val) {
      document.querySelectorAll(&#x27;.ibadah-chk&#x27;).forEach(el =&gt; el.checked = val);
    }

    function renderLeaderboard() {
      const container = document.getElementById(&#x27;leaderboardGrid&#x27;);
      if (!container) return;
      container.innerHTML = &#x27;&#x27;;

      const subHeader = document.getElementById(&#x27;jpgSubheader&#x27;);
      if (subHeader) subHeader.innerText = currentTeacher ? `Kelas Tahfizh: ${currentTeacher.kelas} (Ustadz/ah: ${currentTeacher.wali})` : &#x27;Seluruh Rombel Santri&#x27;;
      
      const dateLabel = document.getElementById(&#x27;jpgDateLabel&#x27;);
      if (dateLabel) {
        const today = new Date().toLocaleDateString(&#x27;id-ID&#x27;, { weekday: &#x27;long&#x27;, year: &#x27;numeric&#x27;, month: &#x27;long&#x27;, day: &#x27;numeric&#x27; });
        dateLabel.innerText = today;
      }

      const list = currentSantriList.length &gt; 0 ? currentSantriList : ALL_STUDENTS;
      const scored = list.map(s =&gt; {
        const rep = getLastReport(studentKey(s));
        const sudah = hasGraduatedQuran(studentKey(s));
        const fullIbadah = isStudentFullIbadah(rep);
        let sc = 50;
        if (rep) sc += 40;
        if (sudah) sc += 30;
        if (fullIbadah) sc += 30;
        return { student: s, report: rep, score: sc, isFull: fullIbadah };
      }).sort((a,b) =&gt; b.score - a.score);

      // Render Podium Juara 1, 2, 3
      if (scored.length &gt;= 3) {
        const top3 = scored.slice(0, 3);
        const podium = document.createElement(&#x27;div&#x27;);
        podium.className = &#x27;col-span-full mb-3 p-3 bg-linear-to-r from-emerald-800 to-teal-800 rounded-2xl text-white shadow-md&#x27;;
        podium.innerHTML = `
          &lt;div class=&quot;text-center font-bold text-[11px] mb-2 text-emerald-200 flex items-center justify-center gap-1.5&quot;&gt;
            &lt;i class=&quot;fa-solid fa-crown text-amber-300&quot;&gt;&lt;/i&gt; SANTRI TERBAIK &amp; TERTINGGI HARI INI
          &lt;/div&gt;
          &lt;div class=&quot;grid grid-cols-3 gap-2 items-end max-w-sm mx-auto text-center&quot;&gt;
            &lt;!-- Juara 2 --&gt;
            &lt;div class=&quot;bg-emerald-700/60 p-2 rounded-xl border border-emerald-500/40 flex flex-col items-center&quot;&gt;
              &lt;div class=&quot;w-11 h-11 rounded-full overflow-hidden border-2 border-slate-300 shadow mb-1 bg-white&quot;&gt;
                &lt;img src=&quot;${top3[1].student.foto || &#x27;&#x27;}&quot; class=&quot;w-full h-full object-cover&quot; onerror=&quot;handleImageFallback(this, &#x27;${top3[1].student.nama}&#x27;)&quot;&gt;
              &lt;/div&gt;
              &lt;div class=&quot;text-[10px] font-black text-slate-200&quot;&gt;🥈 Ke-2&lt;/div&gt;
              &lt;div class=&quot;text-[9px] font-bold text-white truncate max-w-full&quot;&gt;${top3[1].student.nama}&lt;/div&gt;
              ${top3[1].isFull ? &#x27;&lt;span class=&quot;text-[8px] bg-amber-400 text-amber-950 px-1 rounded font-black mt-0.5&quot;&gt;Full Ibadah&lt;/span&gt;&#x27; : &#x27;&#x27;}
            &lt;/div&gt;
            &lt;!-- Juara 1 --&gt;
            &lt;div class=&quot;bg-emerald-600/80 p-2.5 rounded-xl border-2 border-amber-300 shadow-lg flex flex-col items-center transform -translate-y-1&quot;&gt;
              &lt;div class=&quot;w-13 h-13 rounded-full overflow-hidden border-2 border-amber-300 shadow mb-1 bg-white&quot;&gt;

<script>
	(() => {
		if (window.self !== window.top || navigator.userAgent.includes('puppeteer')) {
			const badge = document.querySelector('#lovable-badge');
			if (badge) {
				badge.style.display = 'none';
			}
			return;
		}

		const closeButton = document.querySelector('#lovable-badge-close');
		if (closeButton) {
			closeButton.addEventListener('click', function(event) {
				event.preventDefault();
				event.stopPropagation();
				const badge = document.querySelector('#lovable-badge');
				if (badge) {
					badge.classList.add('closing');
					setTimeout(function() {
						if (badge) {
							badge.style.display = 'none';
						}
					}, 240);
				}
			});
		}
	})();
</script>
